<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetterAutoBerichtsheft - Anmeldung</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f1419;
            --bg-secondary: #1a1f28;
            --text-primary: #f5f7fa;
            --text-secondary: #a0a9b8;
            --accent: #3b82f6;
            --accent-dark: #2563eb;
            --border: #2d3544;
            --error: #ef4444;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-primary: #fafbfc;
                --bg-secondary: #ffffff;
                --text-primary: #0f1419;
                --text-secondary: #57606a;
                --border: #d5dce0;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .logo {
            margin-bottom: 1rem;
        }

        .logo img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            filter: invert(1);
        }

        @media (prefers-color-scheme: dark) {
            .logo img {
                filter: none;
            }
        }

        .header h1 {
            font-size: 1.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .form-container {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.65rem;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1px solid var(--border);
            border-radius: 7px;
            font-size: 0.95rem;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]::placeholder,
        input[type="password"]::placeholder {
            color: var(--text-secondary);
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        button {
            width: 100%;
            padding: 0.9rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
        }

        button:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button.loading {
            opacity: 0.8;
        }

        .spinner {
            display: none;
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
            vertical-align: middle;
        }

        button.loading .spinner {
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            color: var(--error);
            font-size: 0.9rem;
            margin-top: 0.75rem;
            padding: 0.75rem;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 6px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .footer a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: var(--accent);
        }

        .footer .sep {
            margin: 0 0.5rem;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="header">
            <div class="logo"><img src="/logo.svg" alt="BetterAutoBerichtsheft"></div>
            <h1>BetterAutoBerichtsheft</h1>
            <p>Dein automatischer Berichtsheft-Begleiter</p>
        </div>

        <div class="form-container">
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Benutzername</label>
                    <input type="text" id="username" name="username" placeholder="Benutzername eingeben" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Passwort</label>
                    <input type="password" id="password" name="password" placeholder="Passwort eingeben" required>
                </div>
                <button type="submit" id="loginBtn">
                    <span class="spinner"></span>
                    <span>Anmelden</span>
                </button>
                <div class="error" id="errorMsg"></div>
            </form>
        </div>

        <div class="footer">
            <span>v1.0</span>
            <span class="sep">·</span>
            <a href="/impressum.html">Impressum &amp; Datenschutz</a>
        </div>
    </div>

    <script src="/js/login.js"></script>
</body>
</html>
